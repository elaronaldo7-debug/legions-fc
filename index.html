<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legions FC Attendance</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
<header>
  <img src="icons/logo.png" alt="">
  <div class="ht"><h1>LEGIONS FC</h1><small>Attendance · Coach</small></div>
  <button class="btn" id="exp">📤<span class="lbl"> Export</span></button>
  <button class="btn red" id="add">＋<span class="lbl"> Player</span></button>
</header>
<section class="live"><span class="dot"></span><b>Live</b><input type="date" id="date"><button class="btn" id="inst" hidden>⬇ Install</button></section>
<section id="v-att">
  <div id="bday" hidden></div>
  <div class="stats" id="sum"></div>
  <div class="search"><span>🔍</span><input id="q" placeholder="Search players..."></div>
  <div class="cats" id="tabs"></div>
  <div class="ccard" id="ccard"></div>
  <div class="acts"><button class="all p" id="allP">✓ All Present</button><button class="all a" id="allA">✕ All Absent</button><button class="all r" id="rst">↺ Reset</button></div>
  <div id="list"></div>
</section>
<section id="v-his" hidden><h3 class="vt">Session History</h3><div id="hist"></div></section>
<section id="v-rep" hidden>
  <h3 class="vt">Attendance Report</h3>
  <div class="cats" id="rtabs"></div>
  <div class="filt"><input type="date" id="rf"><span>→</span><input type="date" id="rt"></div>
  <div class="chips"><button data-r="month">This Month</button><button data-r="30">Last 30 Days</button><button data-r="all">All Time</button></div>
  <div class="stats" id="rsum" style="grid-template-columns:repeat(3,1fr)"></div>
  <div id="rep"></div>
  <div class="acts rb"><button class="all p" id="repWa">📤 WhatsApp</button><button class="all" id="csv">📥 Excel (CSV)</button><button class="all" id="prt">🖨 Print / PDF</button></div>
  <div class="zoombox"><small>📱 Display size</small><div class="zchips" id="zs"><button data-z="0.8">Small</button><button data-z="0.9">Medium</button><button data-z="1">Large</button></div></div>
  <div class="cloudbox" id="cloudbox" hidden><small id="cuser"></small><button class="ghost" id="upl">⬆ Upload old device data</button><button class="ghost" id="logout">Logout</button></div>
</section>
</div>
<nav id="nav">
  <button data-v="att" class="on"><img src="icons/logo.png"><span>Attendance</span></button>
  <button data-v="his"><i>📅</i><span>History</span></button>
  <button data-v="rep"><i>📊</i><span>Report</span></button>
</nav>

<div class="modal" id="mAdd"><form class="card" id="fAdd">
  <h2 id="addT">Add Player</h2>
  <label class="pic"><img id="pv" src="icons/logo.png"><span>Tap to add photo</span><input type="file" id="photo" accept="image/*" hidden></label>
  <input id="pn" placeholder="Player name" required>
  <div class="row2"><input id="pno" type="number" placeholder="Jersey #"><input id="ppos" placeholder="Position"></div>
  <small class="fl">🎂 Date of birth</small><input id="pdob" type="date">
  <select id="pcat"><option>Junior</option><option>Senior</option></select>
  <div class="row2"><button type="button" class="ghost" data-close>Cancel</button><button class="gold">Save</button></div>
</form></div>
<div class="modal" id="mProf"><div class="card" id="prof"></div></div>
<div class="modal" id="mAlert"><div class="card" id="alertBox"></div></div>
<div class="modal" id="mLogin"><form class="card" id="fLogin"><img src="icons/logo.png" class="lg"><h2>LEGIONS FC</h2><small style="text-align:center">Coach Login</small>
  <input id="lem" type="email" placeholder="Email" required><input id="lpw" type="password" placeholder="Password" required><div id="lerr" class="err"></div><button class="gold">Login</button></form></div>
<div id="toast"></div>
<script src="app.js"></script>
<script type="module" src="cloud.js"></script>
</body></html>
